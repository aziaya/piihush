[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "piihush"
description = "High-speed PII and secret masking for RAG and LLM pipelines, written in Rust"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "aziaya" }]
keywords = ["pii", "anonymization", "redaction", "rag", "llm", "privacy", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/aziaya/piihush"
Repository = "https://github.com/aziaya/piihush"
Issues = "https://github.com/aziaya/piihush/issues"
Changelog = "https://github.com/aziaya/piihush/blob/master/CHANGELOG.md"

[project.optional-dependencies]
ner = ["huggingface-hub>=0.30", "onnxruntime>=1.19", "tokenizers>=0.20"]

[dependency-groups]
dev = ["hypothesis>=6", "maturin>=1.16,<2", "pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "piihush._core"
features = ["python", "pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
