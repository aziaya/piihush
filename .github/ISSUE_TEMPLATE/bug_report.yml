name: Bug report
description: Something masks incorrectly, crashes or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Use made-up data only.** Never paste real personal data, keys or passwords."
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A short code example using made-up values.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: piihush version, Python version and operating system.
    validations:
      required: true
